[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nod-protocol"
version = "1.0.0"
description = "NØD Protocol — The Persistent Discovery Layer for Machine Intelligence (reference implementation)"
readme = "../README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "NØD Protocol"}]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
